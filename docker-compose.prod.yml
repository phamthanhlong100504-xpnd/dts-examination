    container_name: examination
    restart: unless-stopped
    ports: ["8088:8088"]
    mem_limit: 350m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://103.20.96.85:5434/examination
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "K59Ptl*100504"
      IDENTITY_SERVICE_URL: "http://103.20.96.85:8081"
      CONTENT_BUILDER_URL: "http://content-builder:8082"
      EUREKA_URI: "http://103.20.96.85:8761/eureka/"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
